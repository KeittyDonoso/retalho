<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Retalho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column studio bench. Preview on top, controls in the middle, timeline at the bottom. */
:root {
  --bg: #0b0b0d;
  --panel: #17171b;
  --raised: #212126;
  --line: #2c2c33;
  --fg: #fafafa;
  --muted: #a1a1aa;
  --accent: #ff4f12;
  --on-accent: #050506;
  --mark: #d4ff3a;
  --clip: #2c2c33;
  --text-clip: #ffd60a;
  --danger: #ff3b5c;
  --stage: #050506;
  --font-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f3ed; --panel: #fafaf6; --raised: #e8ebdf; --line: #d8dbcf; --fg: #242721;
    --muted: #606957; --accent: #e63f05; --on-accent: #ffffff; --mark: #557522;
    --clip: #d8dbcf; --text-clip: #7a5f00; --danger: #c4122f; --stage: #242721;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f3ed; --panel: #fafaf6; --raised: #e8ebdf; --line: #d8dbcf; --fg: #242721;
  --muted: #606957; --accent: #e63f05; --on-accent: #ffffff; --mark: #557522;
  --clip: #d8dbcf; --text-clip: #7a5f00; --danger: #c4122f; --stage: #242721;
  color-scheme: light;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 24px;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 24px; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 2px; }
.brand b { color: var(--accent); }
.file { color: var(--muted); font-size: 13px; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--raised); color: var(--muted); margin-left: 6px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 700;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }

/* preview */
.stage-wrap { display: flex; justify-content: center; background: var(--stage); border-radius: 16px; padding: 10px; }
.stage { position: relative; max-width: 100%; width: 640px; height: 360px; }
.stage video { width: 100%; height: 100%; display: block; background: #000; border-radius: 6px; }
.overlay { position: absolute; inset: 0; pointer-events: none; container-type: size; }
.cap {
  position: absolute; left: 6%; right: 6%; text-align: center; font-weight: 800; color: #fff;
  font-size: 7cqh; line-height: 1.15; text-wrap: balance; text-shadow: 0 0.06em 0.25em rgba(0,0,0,0.85);
}
.cap span { background: rgba(0,0,0,0.55); padding: 0.08em 0.3em; border-radius: 0.2em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.cap.bottom { bottom: 8%; } .cap.middle { top: 50%; transform: translateY(-50%); } .cap.top { top: 8%; }
.drop-hint { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 30%, transparent); border: 3px dashed var(--accent); border-radius: 16px; font-weight: 800; font-size: 20px; color: #fff; }

/* transport + tools */
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.play { width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.play svg.i { width: 24px; height: 24px; fill: currentColor; stroke: none; }
.tc { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; color: var(--muted); }
.tc b { color: var(--mark); font-weight: 700; }
.spacer { flex: 1; }
.tools { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.tool {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 700;
}
.tool:hover:not(:disabled) { border-color: var(--muted); }
.tool:disabled { opacity: 0.35; cursor: not-allowed; }
.tool kbd { font-family: var(--font-num); font-size: 10px; color: var(--muted); font-weight: 500; }

/* timeline */
.timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 0 12px; display: flex; flex-direction: column; gap: 8px; }
.tl-head { display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 12px; color: var(--muted); }
.tl-head label { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.tl-head input[type=range] { width: 110px; accent-color: var(--accent); }
.scroller { overflow-x: auto; overflow-y: hidden; padding: 0 12px; touch-action: pan-x; }
.lane-wrap { position: relative; min-width: 100%; }
.ruler { position: relative; height: 18px; font-family: var(--font-num); font-size: 10px; color: var(--muted); }
.ruler i { position: absolute; top: 0; height: 6px; border-left: 1px solid var(--line); }
.ruler span { position: absolute; top: 4px; transform: translateX(3px); white-space: nowrap; }
.track { position: relative; height: 64px; margin-top: 4px; border-radius: 8px; background: var(--raised); touch-action: none; }
.track.texts { height: 34px; }
.track-label { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; }
.clip {
  position: absolute; top: 0; bottom: 0; border-radius: 8px; overflow: hidden; background: var(--clip);
  border: 2px solid transparent; display: flex;
}
.clip img { height: 100%; flex: none; object-fit: cover; opacity: 0.9; pointer-events: none; }
.clip + .clip { margin-left: 0; }
.clip.sel { border-color: var(--accent); }
.clip .len { position: absolute; left: 4px; bottom: 3px; font-family: var(--font-num); font-size: 10px; background: rgba(0,0,0,0.6); color: #fff; padding: 1px 4px; border-radius: 4px; }
.cut { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--bg); pointer-events: none; }
.tblock {
  position: absolute; top: 3px; bottom: 3px; border-radius: 6px; background: color-mix(in srgb, var(--text-clip) 22%, var(--raised));
  border: 2px solid color-mix(in srgb, var(--text-clip) 60%, transparent); color: var(--fg); font-size: 11.5px; font-weight: 700;
  padding: 0 6px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; cursor: grab;
}
.tblock.sel { border-color: var(--accent); }
.head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--mark); pointer-events: none; z-index: 3; }
.head::before { content: ""; position: absolute; top: 0; left: -6px; border: 7px solid transparent; border-top-color: var(--mark); border-bottom: 0; }

/* inspector */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.panel p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 62ch; }
.fields { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea {
  min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; font-size: 15px; color: var(--fg);
}
.field textarea { resize: vertical; min-height: 44px; }
.field input[type=number] { width: 90px; font-family: var(--font-num); }

/* modal */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(5,5,6,0.7); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(480px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow: auto; }
.sheet h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.5; }
.progress { height: 10px; border-radius: 99px; background: var(--raised); overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s linear; }
.sheet video { width: 100%; max-height: 40vh; border-radius: 10px; background: #000; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); }
.keys { font-size: 12px; color: var(--muted); }
.keys kbd { font-family: var(--font-num); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

@media (max-width: 640px) {
  .tools { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tool kbd, .keys { display: none; }
  .fields { grid-template-columns: 1fr 1fr; }
  .fields .field:first-child { grid-column: 1 / -1; }
  .brand { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { .progress div { transition: none; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">Retalho<b>.</b></div>
    <div class="file" id="fileName">Vídeo de exemplo <span class="tag">exemplo</span></div>
    <label class="btn primary" for="fileInput"><svg class="i"><use href="#i-upload"/></svg>Abrir vídeo</label>
    <input id="fileInput" type="file" accept="video/*" hidden>
  </header>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <video id="vid" playsinline preload="auto"></video>
      <div class="overlay" id="overlay"></div>
    </div>
  </div>

  <div class="bar">
    <button class="play" id="playBtn" aria-label="Tocar"><svg class="i"><use href="#i-play"/></svg></button>
    <div class="tc"><b id="tcNow">00:00.0</b> / <span id="tcTotal">00:00.0</span></div>
    <div class="spacer"></div>
    <button class="btn primary" id="exportBtn"><svg class="i"><use href="#i-download"/></svg>Exportar</button>
  </div>

  <div class="tools">
    <button class="tool" id="splitBtn"><svg class="i"><use href="#i-cut"/></svg>Dividir<kbd>S</kbd></button>
    <button class="tool" id="delBtn"><svg class="i"><use href="#i-trash"/></svg>Apagar<kbd>Del</kbd></button>
    <button class="tool" id="textBtn"><svg class="i"><use href="#i-type"/></svg>Texto<kbd>T</kbd></button>
    <button class="tool" id="undoBtn"><svg class="i"><use href="#i-undo"/></svg>Desfazer<kbd>Ctrl Z</kbd></button>
    <button class="tool" id="redoBtn"><svg class="i"><use href="#i-redo"/></svg>Refazer<kbd>Ctrl Y</kbd></button>
  </div>

  <section class="timeline" aria-label="Linha do tempo">
    <div class="tl-head">
      <span id="clipCount">1 trecho</span>
      <label for="zoom">Zoom <input id="zoom" type="range" min="1" max="10" step="0.5" value="1"></label>
    </div>
    <div class="scroller" id="scroller">
      <div class="lane-wrap" id="lanes">
        <div class="ruler" id="ruler"></div>
        <div class="track" id="trackVideo"></div>
        <div class="track texts" id="trackText"><span class="track-label">Textos</span></div>
        <div class="head" id="head"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="inspector"></section>

  <div class="keys">Atalhos: <kbd>Espaço</kbd> tocar/pausar · <kbd>←</kbd> <kbd>→</kbd> andar 1 s · <kbd>S</kbd> dividir · <kbd>Del</kbd> apagar · <kbd>T</kbd> texto</div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" hidden></div>

const $ = (id) => document.getElementById(id);
const vid = $("vid");
const state = { clips: [], texts: [], sel: null, T: 0 };
let src = null;               // { url, name, duration, w, h, sample }
let thumbs = [];              // [{ t, url }]
let undoStack = [], redoStack = [];
let curI = 0, jumping = false, playing = false, exporting = false;
let audio = null;             // { ctx, speaker, dest }
let nextId = 1;

/* ---------- helpers ---------- */
const fmt = (s) => {
  s = Math.max(0, s || 0);
  const m = Math.floor(s / 60), r = s - m * 60;
  return String(m).padStart(2, "0") + ":" + r.toFixed(1).padStart(4, "0");
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const total = () => state.clips.reduce((a, c) => a + (c.e - c.s), 0);
function outToSrc(T) {
  let acc = 0;
  for (let i = 0; i < state.clips.length; i++) {
    const c = state.clips[i], d = c.e - c.s;
    if (T < acc + d || i === state.clips.length - 1) return { i, t: clamp(c.s + (T - acc), c.s, c.e) };
    acc += d;
  }
  return { i: 0, t: 0 };
}
function clipStart(i) { let acc = 0; for (let k = 0; k < i; k++) acc += state.clips[k].e - state.clips[k].s; return acc; }
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600); }

function snapshot() { return JSON.stringify({ clips: state.clips, texts: state.texts }); }
function commit() { undoStack.push(snapshot()); if (undoStack.length > 100) undoStack.shift(); redoStack = []; }
function restore(json) { const o = JSON.parse(json); state.clips = o.clips; state.texts = o.texts; state.sel = null; state.T = clamp(state.T, 0, total()); seekOut(state.T); render(); }

/* ---------- loading ---------- */
function loadVideo(url, name, sample) {
  pause();
  if (src && !src.sample) URL.revokeObjectURL(src.url);
  src = { url, name, sample, duration: 0, w: 16, h: 9 };
  vid.src = url;
  $("fileName").innerHTML = "";
  $("fileName").append(document.createTextNode(name));
  if (sample) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "exemplo"; $("fileName").append(tag); }
  vid.addEventListener("loadedmetadata", () => {
    if (!isFinite(vid.duration)) { toast("Não consegui ler a duração deste vídeo. Tente outro arquivo."); return; }
    src.duration = vid.duration; src.w = vid.videoWidth || 16; src.h = vid.videoHeight || 9;
    fitStage();
    state.clips = [{ id: nextId++, s: 0, e: vid.duration }];
    state.texts = sample ? [{ id: nextId++, t0: 0.5, t1: 3.5, text: "Toque em Texto para escrever o seu", pos: "bottom" }] : [];
    state.sel = null; state.T = 0; curI = 0; undoStack = []; redoStack = [];
    render(); makeThumbs(url);
  }, { once: true });
  vid.addEventListener("error", () => toast("Este formato de vídeo não abre neste navegador. Tente um arquivo MP4."), { once: true });
}
$("fileInput").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  loadVideo(URL.createObjectURL(f), f.name, false); e.target.value = "";
});
// drag and drop a file anywhere on the page
let dragDepth = 0;
addEventListener("dragenter", (e) => { if (!e.dataTransfer.types.includes("Files")) return; dragDepth++; showDrop(true); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; showDrop(false); } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; showDrop(false);
  const f = [...e.dataTransfer.files].find((x) => x.type.startsWith("video/"));
  if (f) loadVideo(URL.createObjectURL(f), f.name, false); else toast("Solte um arquivo de vídeo.");
});
function showDrop(on) {
  let d = document.querySelector(".drop-hint");
  if (on && !d) { d = document.createElement("div"); d.className = "drop-hint"; d.textContent = "Solte o vídeo aqui"; $("stage").append(d); }
  if (!on && d) d.remove();
}

async function makeThumbs(url) {
  thumbs = [];
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
  await new Promise((r) => v.addEventListener("loadeddata", r, { once: true }));
  const n = clamp(Math.round(src.duration / 1.5), 6, 40);
  const c = document.createElement("canvas"); c.height = 96; c.width = Math.round(96 * src.w / src.h);
  const g = c.getContext("2d");
  for (let k = 0; k < n; k++) {
    if (!src || src.url !== url) return;
    const t = (k + 0.5) * src.duration / n;
    v.currentTime = t;
    await new Promise((r) => v.addEventListener("seeked", r, { once: true }));
    g.drawImage(v, 0, 0, c.width, c.height);
    thumbs.push({ t, url: c.toDataURL("image/jpeg", 0.6) });
    if (k % 4 === 3 || k === n - 1) renderTimeline();
  }
  v.removeAttribute("src"); v.load();
}

/* ---------- audio (needed so the export carries sound) ---------- */
function ensureAudio() {
  if (audio) { audio.ctx.resume(); return audio; }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const node = ctx.createMediaElementSource(vid);
    const speaker = ctx.createGain(); const dest = ctx.createMediaStreamDestination();
    node.connect(speaker); speaker.connect(ctx.destination); node.connect(dest);
    audio = { ctx, speaker, dest };
  } catch (err) { audio = null; }
  return audio;
}

/* ---------- playback ---------- */
function seekOut(T) {
  state.T = clamp(T, 0, total());
  const m = outToSrc(state.T); curI = m.i;
  if (Math.abs(vid.currentTime - m.t) > 0.01) { jumping = true; vid.currentTime = m.t; }
}
vid.addEventListener("seeked", () => (jumping = false));
async function play() {
  if (!src || exporting) return;
  ensureAudio();
  if (state.T >= total() - 0.05) seekOut(0);
  playing = true; setPlayIcon();
  try { await vid.play(); } catch (e) { playing = false; setPlayIcon(); }
}
function pause() { playing = false; vid.pause(); setPlayIcon(); }
function setPlayIcon() {
  $("playBtn").innerHTML = '<svg class="i"><use href="#i-' + (playing ? "pause" : "play") + '"/></svg>';
  $("playBtn").setAttribute("aria-label", playing ? "Pausar" : "Tocar");
}
$("playBtn").onclick = () => (playing ? pause() : play());

function tick() {
  if (playing && !exporting && !jumping && state.clips.length) {
    const c = state.clips[curI];
    if (!c) { pause(); }
    else if (vid.currentTime >= c.e - 0.03 || vid.ended) {
      if (curI < state.clips.length - 1) { curI++; jumping = true; vid.currentTime = state.clips[curI].s; state.T = clipStart(curI); }
      else { pause(); state.T = total(); }
    } else if (vid.currentTime >= c.s - 0.05) {
      state.T = clipStart(curI) + (vid.currentTime - c.s);
    }
  }
  if (!exporting) { drawHead(); drawOverlay($("overlay"), state.T); $("tcNow").textContent = fmt(state.T); }
  requestAnimationFrame(tick);
}

/* ---------- text overlay ---------- */
function textsAt(T) { return state.texts.filter((x) => T >= x.t0 && T < x.t1); }
function drawOverlay(el, T) {
  const key = textsAt(T).map((x) => x.id + x.text + x.pos).join("|");
  if (el.dataset.key === key) return;
  el.dataset.key = key; el.innerHTML = "";
  for (const x of textsAt(T)) {
    const d = document.createElement("div"); d.className = "cap " + x.pos;
    const s = document.createElement("span"); s.textContent = x.text; d.append(s); el.append(d);
  }
}

/* ---------- editing actions ---------- */
function split() {
  if (!src) return;
  const m = outToSrc(state.T), c = state.clips[m.i];
  if (m.t - c.s < 0.1 || c.e - m.t < 0.1) { toast("Leve a agulha para o meio de um trecho para dividir."); return; }
  commit();
  const right = { id: nextId++, s: m.t, e: c.e };
  c.e = m.t; state.clips.splice(m.i + 1, 0, right);
  state.sel = { type: "clip", id: right.id };
  render(); toast("Trecho dividido. Toque em Apagar para tirar uma parte.");
}
function del() {
  const s = state.sel; if (!s) { toast("Toque num trecho ou texto na linha do tempo para escolher o que apagar."); return; }
  if (s.type === "clip") {
    if (state.clips.length === 1) { toast("O vídeo precisa ter pelo menos um trecho."); return; }
    commit();
    // texts after the removed piece slide left with the video; texts inside it go away
    const idx = state.clips.findIndex((c) => c.id === s.id), a = clipStart(idx), d = state.clips[idx].e - state.clips[idx].s, b = a + d;
    state.clips.splice(idx, 1);
    const len = total();
    state.texts = state.texts
      .filter((x) => !(x.t0 >= a && x.t1 <= b))
      .map((x) => {
        const t0 = x.t0 >= b ? x.t0 - d : x.t0 >= a ? a : x.t0;
        const t1 = x.t1 >= b ? x.t1 - d : x.t1 >= a ? a : x.t1;
        return { ...x, t0, t1: Math.min(len, Math.max(t1, t0 + 0.5)) };
      })
      .filter((x) => x.t0 < len - 0.1);
  } else {
    commit(); state.texts = state.texts.filter((x) => x.id !== s.id);
  }
  state.sel = null; seekOut(Math.min(state.T, total())); render();
}
function addText() {
  if (!src) return;
  commit();
  const len = total(), t0 = clamp(state.T, 0, Math.max(0, len - 0.5));
  const x = { id: nextId++, t0, t1: Math.min(len, t0 + 3), text: "Seu texto aqui", pos: "bottom" };
  state.texts.push(x); state.sel = { type: "text", id: x.id };
  render();
  const inp = $("txtInput"); if (inp) { inp.focus(); inp.select(); }
}
$("splitBtn").onclick = split; $("delBtn").onclick = del; $("textBtn").onclick = addText;
$("undoBtn").onclick = () => { if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); };
$("redoBtn").onclick = () => { if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); };

addEventListener("keydown", (e) => {
  if (exporting || e.target.closest("input, textarea, select")) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); playing ? pause() : play(); }
  else if (k === "s") split();
  else if (k === "t") { e.preventDefault(); addText(); }
  else if (k === "delete" || k === "backspace") del();
  else if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); (e.shiftKey ? $("redoBtn") : $("undoBtn")).click(); }
  else if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); $("redoBtn").click(); }
  else if (k === "arrowleft" || k === "arrowright") { e.preventDefault(); pause(); seekOut(state.T + (k === "arrowleft" ? -1 : 1)); }
});

/* ---------- timeline ---------- */
let pps = 50;
function laneWidth() { return $("scroller").clientWidth - 24; }
function render() { renderTimeline(); renderInspector(); updateButtons(); }
function updateButtons() {
  $("tcTotal").textContent = fmt(total());
  $("undoBtn").disabled = !undoStack.length; $("redoBtn").disabled = !redoStack.length;
  $("delBtn").disabled = !state.sel;
  const n = state.clips.length; $("clipCount").textContent = n + (n === 1 ? " trecho" : " trechos") + " · " + state.texts.length + (state.texts.length === 1 ? " texto" : " textos");
}
function renderTimeline() {
  const len = total() || 1, zoom = +$("zoom").value;
  const w = Math.max(100, laneWidth() * zoom);
  pps = w / len;
  $("lanes").style.width = w + "px";
  // ruler: pick a step that leaves ~70px between labels
  const steps = [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
  const step = steps.find((s) => s * pps >= 70) || 600;
  const r = $("ruler"); r.innerHTML = "";
  for (let t = 0; t <= len + 0.001; t += step) {
    const i = document.createElement("i"); i.style.left = t * pps + "px"; r.append(i);
    if (t * pps > w - 44) continue;
    const s = document.createElement("span"); s.style.left = t * pps + "px"; s.textContent = fmt(t).replace(/\.0$/, ""); r.append(s);
  }
  // video clips
  const tv = $("trackVideo"); tv.innerHTML = "";
  const tileW = 60 * src_ar();
  let acc = 0;
  state.clips.forEach((c, idx) => {
    const d = c.e - c.s, el = document.createElement("div");
    el.className = "clip" + (state.sel && state.sel.type === "clip" && state.sel.id === c.id ? " sel" : "");
    el.style.left = acc * pps + "px"; el.style.width = Math.max(2, d * pps) + "px";
    const tiles = Math.ceil((d * pps) / tileW);
    for (let k = 0; k < tiles && thumbs.length; k++) {
      const t = c.s + ((k + 0.5) * tileW) / pps;
      let best = thumbs[0]; for (const th of thumbs) if (Math.abs(th.t - t) < Math.abs(best.t - t)) best = th;
      const img = document.createElement("img"); img.src = best.url; img.alt = ""; img.style.width = tileW + "px"; el.append(img);
    }
    const lbl = document.createElement("span"); lbl.className = "len"; lbl.textContent = d.toFixed(1) + " s"; el.append(lbl);
    el.dataset.id = c.id;
    tv.append(el);
    if (idx > 0) { const cut = document.createElement("div"); cut.className = "cut"; cut.style.left = acc * pps - 1 + "px"; tv.append(cut); }
    acc += d;
  });
  // text blocks
  const tt = $("trackText"); tt.querySelectorAll(".tblock").forEach((n) => n.remove());
  for (const x of state.texts) {
    const el = document.createElement("div");
    el.className = "tblock" + (state.sel && state.sel.type === "text" && state.sel.id === x.id ? " sel" : "");
    el.style.left = x.t0 * pps + "px"; el.style.width = Math.max(14, (x.t1 - x.t0) * pps) + "px";
    el.textContent = x.text; el.dataset.id = x.id; tt.append(el);
  }
  tt.querySelector(".track-label").hidden = state.texts.length > 0;
  drawHead();
}
const src_ar = () => (src ? src.w / src.h : 16 / 9);
function drawHead() { $("head").style.left = state.T * pps + "px"; }
$("zoom").addEventListener("input", renderTimeline);
addEventListener("resize", () => { fitStage(); renderTimeline(); });
function fitStage() {
  const ar = src_ar(), maxW = $("stage").parentElement.clientWidth - 20;
  const maxH = innerWidth <= 640 ? innerHeight * 0.42 : Math.min(innerHeight * 0.52, 560);
  const w = Math.min(maxW, maxH * ar);
  $("stage").style.width = Math.round(w) + "px"; $("stage").style.height = Math.round(w / ar) + "px";
}

function timeFromEvent(e) { const r = $("lanes").getBoundingClientRect(); return clamp((e.clientX - r.left) / pps, 0, total()); }
// scrub on the video track; tap a clip to select it
$("trackVideo").addEventListener("pointerdown", (e) => {
  if (!src || exporting) return;
  pause();
  const clipEl = e.target.closest(".clip");
  state.sel = clipEl ? { type: "clip", id: +clipEl.dataset.id } : null;
  seekOut(timeFromEvent(e)); render();
  const move = (ev) => seekOut(timeFromEvent(ev));
  const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
  addEventListener("pointermove", move); addEventListener("pointerup", up);
});
$("ruler").addEventListener("pointerdown", (e) => { pause(); seekOut(timeFromEvent(e)); });
// drag a text block to move it
$("trackText").addEventListener("pointerdown", (e) => {
  if (!src || exporting) return;
  const b = e.target.closest(".tblock");
  if (!b) { state.sel = null; pause(); seekOut(timeFromEvent(e)); render(); return; }
  const x = state.texts.find((t) => t.id === +b.dataset.id); if (!x) return;
  pause(); state.sel = { type: "text", id: x.id };
  const startX = e.clientX, t0 = x.t0, d = x.t1 - x.t0; let moved = false;
  render();
  const move = (ev) => {
    const dt = (ev.clientX - startX) / pps;
    if (!moved && Math.abs(ev.clientX - startX) < 4) return;
    if (!moved) { commit(); moved = true; }
    x.t0 = clamp(t0 + dt, 0, Math.max(0, total() - d)); x.t1 = x.t0 + d;
    seekOut(x.t0); renderTimeline();
  };
  const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); if (!moved) seekOut(x.t0); render(); };
  addEventListener("pointermove", move); addEventListener("pointerup", up);
});

/* ---------- inspector ---------- */
function renderInspector() {
  const box = $("inspector"); const s = state.sel;
  const x = s && s.type === "text" ? state.texts.find((t) => t.id === s.id) : null;
  if (!x) {
    const c = s && s.type === "clip" ? state.clips.find((k) => k.id === s.id) : null;
    box.innerHTML = c
      ? '<h2>Trecho escolhido</h2><p>Vai de ' + fmt(c.s) + ' até ' + fmt(c.e) + ' do vídeo original (' + (c.e - c.s).toFixed(1) + ' s). Toque em <b>Apagar</b> para tirar este trecho, ou em <b>Dividir</b> para cortar onde está a agulha.</p>'
      : '<h2>Como usar</h2><p>Arraste na linha do tempo para escolher um ponto. <b>Dividir</b> corta o vídeo ali. Toque num trecho e em <b>Apagar</b> para tirar o que não quer. <b>Texto</b> coloca uma legenda. No fim, toque em <b>Exportar</b>.</p>';
    return;
  }
  box.innerHTML =
    '<h2>Texto escolhido</h2><div class="fields">' +
    '<label class="field" for="txtInput">Texto<textarea id="txtInput" rows="1"></textarea></label>' +
    '<label class="field" for="txtPos">Posição<select id="txtPos"><option value="top">Em cima</option><option value="middle">No meio</option><option value="bottom">Embaixo</option></select></label>' +
    '<label class="field" for="txtDur">Duração (s)<input id="txtDur" type="number" min="0.5" step="0.5"></label></div>';
  $("txtInput").value = x.text; $("txtPos").value = x.pos; $("txtDur").value = +(x.t1 - x.t0).toFixed(1);
  let typed = false;
  $("txtInput").addEventListener("input", (e) => {
    if (!typed) { commit(); typed = true; }
    x.text = e.target.value; renderTimeline(); updateButtons(); $("overlay").dataset.key = "";
  });
  $("txtPos").addEventListener("change", (e) => { commit(); x.pos = e.target.value; $("overlay").dataset.key = ""; updateButtons(); });
  $("txtDur").addEventListener("change", (e) => {
    const v = parseFloat(e.target.value); if (!(v > 0)) return;
    commit(); x.t1 = Math.min(total(), x.t0 + v); e.target.value = +(x.t1 - x.t0).toFixed(1); renderTimeline(); updateButtons();
  });
}

/* ---------- export ---------- */
function pickMime() {
  if (!window.MediaRecorder) return null;
  const list = [
    ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "mp4"], ["video/mp4", "mp4"],
    ["video/webm;codecs=vp9,opus", "webm"], ["video/webm;codecs=vp8,opus", "webm"], ["video/webm", "webm"],
  ];
  return list.find(([m]) => MediaRecorder.isTypeSupported(m)) || null;
}
function drawCaptions(g, W, H, T) {
  for (const x of textsAt(T)) {
    const fs = Math.round(H * 0.07); g.font = "800 " + fs + "px Figtree, system-ui, sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    const maxW = W * 0.88, words = x.text.split(/\s+/), lines = []; let line = "";
    for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line);
    const lh = fs * 1.2, blockH = lines.length * lh;
    let y0 = x.pos === "top" ? H * 0.08 : x.pos === "middle" ? H / 2 - blockH / 2 : H * 0.92 - blockH;
    lines.forEach((l, i) => {
      const y = y0 + i * lh + lh / 2, tw = g.measureText(l).width, px = fs * 0.3;
      g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(W / 2 - tw / 2 - px, y - lh / 2, tw + px * 2, lh);
      g.fillStyle = "#fff"; g.fillText(l, W / 2, y);
    });
  }
}
function sheet(html) { $("sheet").innerHTML = html; $("modal").hidden = false; }
function closeSheet() { $("modal").hidden = true; $("sheet").innerHTML = ""; }

$("exportBtn").onclick = () => {
  if (!src || exporting) return;
  pause();
  const mime = pickMime();
  if (!mime || !HTMLCanvasElement.prototype.captureStream) {
    sheet('<h2>Exportar não funciona aqui</h2><p>Este navegador não consegue gravar vídeo. Abra o editor no Chrome, Edge ou Safari atualizado.</p><div class="row"><button class="btn" id="mClose">Fechar</button></div>');
    $("mClose").onclick = closeSheet; return;
  }
  sheet('<h2>Exportar vídeo</h2><p>O vídeo final tem ' + fmt(total()) + '. A exportação acontece aqui no seu aparelho e leva o mesmo tempo do vídeo. Deixe esta aba aberta até terminar.</p><div class="row"><button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="mGo">Começar</button></div>');
  $("mClose").onclick = closeSheet;
  $("mGo").onclick = () => runExport(mime);
};

async function runExport([mime, ext]) {
  exporting = true; let cancelled = false;
  sheet('<h2>Exportando…</h2><p id="mMsg">Preparando</p><div class="progress"><div id="mBar"></div></div><div class="row"><button class="btn" id="mStop">Cancelar</button></div>');
  $("mStop").onclick = () => { cancelled = true; };
  const a = ensureAudio(); if (a) a.speaker.gain.value = 0;
  const scale = Math.min(1, 1920 / Math.max(src.w, src.h));
  const W = Math.round(src.w * scale / 2) * 2, H = Math.round(src.h * scale / 2) * 2;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d");
  const stream = cv.captureStream(30);
  if (a) a.dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const stopped = new Promise((r) => (rec.onstop = r));
  const len = total(); let base = 0, active = null, raf;
  const draw = () => {
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H); g.drawImage(vid, 0, 0, W, H);
    if (active) {
      const T = base + clamp(vid.currentTime - active.s, 0, active.e - active.s);
      drawCaptions(g, W, H, T);
      const bar = $("mBar"); if (bar) bar.style.width = (100 * T / len).toFixed(1) + "%";
      const msg = $("mMsg"); if (msg) msg.textContent = fmt(T) + " de " + fmt(len);
    }
    raf = requestAnimationFrame(draw);
  };
  try {
    for (let i = 0; i < state.clips.length && !cancelled; i++) {
      const c = state.clips[i];
      if (rec.state === "recording") rec.pause();
      vid.currentTime = c.s;
      await new Promise((r) => vid.addEventListener("seeked", r, { once: true }));
      active = c;
      if (i === 0) { draw(); rec.start(500); } else rec.resume();
      await vid.play();
      await new Promise((r) => {
        const chk = () => (cancelled || vid.currentTime >= c.e - 0.03 || vid.ended ? r() : requestAnimationFrame(chk));
        chk();
      });
      vid.pause(); base += c.e - c.s;
    }
  } catch (err) { cancelled = true; toast("A exportação parou: " + (err.message || err)); }
  if (rec.state !== "inactive") rec.stop();
  await stopped; cancelAnimationFrame(raf);
  if (a) a.speaker.gain.value = 1;
  exporting = false; seekOut(state.T);
  if (cancelled) { closeSheet(); return; }
  const blob = new Blob(chunks, { type: mime.split(";")[0] });
  const url = URL.createObjectURL(blob);
  const base0 = (src.name || "video").replace(/\.[^.]+$/, "");
  const filename = base0 + "-editado." + ext;
  sheet('<h2>Pronto!</h2><video controls playsinline src="' + url + '"></video><p>' + filename + ' · ' + (blob.size / 1048576).toFixed(1) + ' MB</p><div class="row"><button class="btn" id="mClose">Fechar</button><button class="btn primary" id="mSave"><svg class="i"><use href="#i-download"/></svg>Baixar vídeo</button></div>');
  $("mClose").onclick = () => { URL.revokeObjectURL(url); closeSheet(); };
  $("mSave").onclick = () => saveFile(blob, filename, url);
}
async function saveFile(blob, filename, url) {
  // Inside Claude the page asks the viewer to confirm the save; elsewhere a normal download link works.
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast("Vídeo salvo."); }
    catch (e) { if (e && e.code !== "declined") toast("Não deu para salvar aqui (" + (e.code || "erro") + ")."); }
    return;
  }
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
}

/* ---------- start ---------- */
(function boot() {
  const bin = atob(SAMPLE_B64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  loadVideo(URL.createObjectURL(new Blob([bytes], { type: "video/mp4" })), "Vídeo de exemplo", true);
  setPlayIcon(); render(); requestAnimationFrame(tick);
})();
</script>
</body></html>
