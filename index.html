<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Retalhos</title>
<meta name="description" content="Editor de vídeo no navegador e no celular.">
<meta name="theme-color" content="#0b0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">Retalhos<b>.</b></div>
    <div class="file" id="projInfo"></div>
    <button class="btn primary" id="exportBtn"><svg class="i"><use href="#i-download"/></svg>Exportar</button>
  </header>

  <section class="stage-area">
    <div class="stage-wrap" id="stageWrap">
      <canvas id="view" aria-label="Prévia do vídeo"></canvas>
    </div>
    <div class="bar">
      <button class="play" id="playBtn" aria-label="Tocar"><svg class="i"><use href="#i-play"/></svg></button>
      <div class="tc"><b id="tcNow">00:00.0</b> / <span id="tcTotal">00:00.0</span></div>
    </div>
  </section>

  <aside class="panel" id="inspector" aria-live="polite"></aside>

  <div class="tools">
    <button class="tool add" id="addBtn"><svg class="i"><use href="#i-plus"/></svg>Adicionar</button>
    <button class="tool" id="splitBtn"><svg class="i"><use href="#i-cut"/></svg>Dividir<kbd>S</kbd></button>
    <button class="tool" id="dupBtn"><svg class="i"><use href="#i-copy"/></svg>Duplicar<kbd>D</kbd></button>
    <button class="tool" id="delBtn"><svg class="i"><use href="#i-trash"/></svg>Apagar<kbd>Del</kbd></button>
    <button class="tool" id="undoBtn"><svg class="i"><use href="#i-undo"/></svg>Desfazer<kbd>Ctrl Z</kbd></button>
    <button class="tool" id="redoBtn"><svg class="i"><use href="#i-redo"/></svg>Refazer<kbd>Ctrl Y</kbd></button>
  </div>

  <section class="timeline" aria-label="Linha do tempo">
    <div class="tl-head">
      <span id="tlInfo"></span>
      <label for="zoom">Zoom <input id="zoom" type="range" min="1" max="12" step="0.5" value="1"></label>
    </div>
    <div class="scroller" id="scroller">
      <div class="lanes" id="lanes"></div>
    </div>
  </section>

  <div class="keys">Atalhos: <kbd>Espaço</kbd> tocar · <kbd>←</kbd> <kbd>→</kbd> 1 s · <kbd>S</kbd> dividir · <kbd>D</kbd> duplicar · <kbd>Del</kbd> apagar · <kbd>A</kbd> adicionar</div>
</div>

<input id="videoInput" type="file" accept="video/*" multiple hidden>
<input id="audioInput" type="file" accept="audio/*" hidden>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="hidden-media" id="media" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
